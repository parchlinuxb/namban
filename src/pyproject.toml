[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namban-dns"
version = "2.0.0"
description = "A modern GTK4/Adwaita DNS management application with DoH support"
authors = [
    {name = "Ali Gholipour"},
    {name = "Hussein Eslami"},
    {name = "Sohrab Behdani"},
    {name = "Meshya"},
    {name = "ARS101"},
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
keywords = ["dns", "networking", "gtk4", "adwaita", "linux", "systemd"]

dependencies = [
    "PyGObject>=3.46.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/parchlinuxb/namban"
Documentation = "https://github.com/parchlinuxb/namban#readme"
Repository = "https://github.com/parchlinuxb/namban.git"
"Bug Tracker" = "https://github.com/parchlinuxb/namban/issues"

[project.gui-scripts]
namban = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/package",
    "/README.md",
    "/LICENSE",
    "/namban.svg",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Coverage configuration
[tool.coverage.run]
source = ["src/namban"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
