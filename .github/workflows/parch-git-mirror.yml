name: Mirror to Forgejo

on:
  push:
    branches:
      - '**'
  delete:
  create: 


jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      FORGEJO_MIRROR_URL: ${{ secrets.FORGEJO_MIRROR_URL }}
    steps:
      - name: Checkout
        if: env.FORGEJO_MIRROR_URL != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # we need full history for --mirror

      - name: Push to Forgejo
        if: env.FORGEJO_MIRROR_URL != ''
        run: |
          git remote add forgejo "$FORGEJO_MIRROR_URL"
          git push --mirror forgejo
